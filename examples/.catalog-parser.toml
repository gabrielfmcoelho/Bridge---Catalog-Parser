# Configuration shared by the example repositories (found by walking up from each one).
# Can also live in a remote governance repository and be inherited with `extends = "https://..."`.
# Every key is optional; see the README for the full reference.

[vocabulary]
# Closed lists: any other value is an E002 error. Remove a list to accept any value.
technologies = ["rest-api", "celery", "postgresql", "react"]
protocols = ["http", "https", "tcp", "grpc"]
git_providers = ["github", "gitlab"]
entity_types = ["company"]

[schema]
required_fields = ["owners", "entity", "git"]

[rules]
ignore = []

[diagram]
direction = "LR"
